version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: local-postgres-db
    environment:
      POSTGRES_DB: bedrockdb
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: dbpassword123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbuser -d bedrockdb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
