[project]
name = "bedrock-agent-poc"
version = "0.1.0"
description = "A proof of concept project showcasing Amazon Bedrock Agents"
readme = "README.md"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
requires-python = ">=3.8.1"
dependencies = [
    "boto3>=1.34.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
]

[tool.black]
line-length = 88
target-version = ['py38']
